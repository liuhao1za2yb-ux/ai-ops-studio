<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>联系我们 — 企业智能自动化工作室</title>
  <meta name="description" content="告诉我们你的业务需求，通过电话联系我们，沟通合作事宜。" />
</head>
<body>
  <header class="site-header" data-header></header>

  <section class="detail-hero">
    <div class="container">
      <span class="badge badge-info"><span class="badge-dot"></span>联系我们</span>
      <h1>从一个具体的业务问题开始</h1>
      <p class="detail-sub">告诉我们你现在的业务痛点，我们一起看看 AI 能不能真正帮上忙。</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="detail-grid">
        <div class="detail-main">
          <h2 class="mb-4" style="font-size:var(--fs-2xl)">联系我们</h2>
          <p class="text-muted mb-6">你可以通过以下方式联系我们，沟通业务需求与合作事宜。</p>
        </div>

        <aside class="detail-side">
          <div class="card">
            <h3 style="margin-bottom:var(--sp-4)">联系方式</h3>
            <div class="contact-item">
              <div class="contact-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
              <div><div class="contact-label">联系人</div><div class="contact-value" data-field="name">刘浩</div></div>
            </div>
            <div class="contact-item">
              <div class="contact-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.58 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
              <div><div class="contact-label">电话</div><div class="contact-value" data-field="phone">18435736138</div></div>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </section>

  <footer class="site-footer" data-footer></footer>
  <script type="module" src="/src/main.js"></script>
  <script type="module">
    import { siteConfig } from '/src/data/site.js'
    const c = siteConfig.contact
    // 姓名
    const nameEl = document.querySelector('[data-field="name"]')
    if (nameEl) nameEl.textContent = c.name || '联系方式待配置'
    // 电话（可点击拨号）
    const phoneEl = document.querySelector('[data-field="phone"]')
    if (phoneEl) {
      if (c.phone) {
        phoneEl.innerHTML = `<a href="tel:${c.phone}" style="color:inherit;text-decoration:none">${c.phone}</a>`
      } else {
        phoneEl.textContent = '联系方式待配置'
      }
    }
  </script>
</body>
</html>
